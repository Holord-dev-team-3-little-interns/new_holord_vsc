<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holord - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-white to-[#e3f0ff] text-[#203d81] min-h-screen flex items-center justify-center">
    <div class="text-center p-8 max-w-xl">
        <img src="logo4.png" alt="Holord Logo" class="mx-auto w-32" />
        <h1 class="text-5xl font-extrabold mb-4 text-[#203d81]">
            Welcome to Holord
        </h1>
        <p class="text-lg text-[#1860ac]/90 mb-8">
            Step into holographic fashion. Try outfits instantly with
            AI-powered hologram simulation.
        </p>
        <button onclick="goToCapture()" 
                class="bg-[#203d81] text-white font-semibold px-8 py-3 rounded-lg shadow-lg hover:bg-[#1860ac] transition-all">
            Start Experience
        </button>
    </div>

    <script>
        // Check if user is logged in
        if (!localStorage.getItem('holord_token')) {
            // If not logged in, redirect to login page
            window.location.href = 'index.html';
        }

        function goToCapture() {
            window.location.href = 'capture.html';
        }
    </script>
</body>
</html>
