<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holord - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .logo {
            height: 60px;
            margin-bottom: 1.5rem;
        }
        
        /* Hide/show elements */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <!-- Login/Signup Card -->
    <div id="authCard" class="login-card">
        <!-- Logo -->
        <div class="text-center mb-8">
            <img src="logo.png" alt="Holord" class="logo inline-block">
            <h1 class="text-2xl font-bold text-gray-800 mt-2">Welcome to Holord</h1>
            <p class="text-gray-600">Sign in to your account</p>
        </div>
        
        <!-- Login Form -->
        <div id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 mb-2">Email</label>
                <input type="email" id="email" 
                       class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                       placeholder="you@example.com">
            </div>
            
            <div>
                <label class="block text-gray-700 mb-2">Password</label>
                <input type="password" id="password" 
                       class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                       placeholder="••••••••">
            </div>
            
            <button onclick="login()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                Sign In
            </button>
            
            <div class="text-center text-gray-600 my-4">or</div>
            
            <button onclick="showSignupMessage()" 
                    class="w-full border-2 border-blue-600 text-blue-600 hover:bg-blue-50 font-semibold py-3 rounded-lg transition">
                Create New Account
            </button>
        </div>
        
        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="hidden text-center py-4">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="text-gray-600 mt-2">Please wait...</p>
        </div>
        
        <div class="mt-6 text-center text-sm text-gray-500">
            <p>By continuing, you agree to our Terms & Privacy</p>
        </div>
    </div>
    
    <!-- Homepage (Shown after login) -->
    <div id="homepage" class="hidden text-center p-8 max-w-xl">
        <img src="logo4.png" alt="Holord Logo" class="mx-auto w-32" />
        <h1 class="text-5xl font-extrabold mb-4 text-[#203d81]">
            Welcome to Holord
        </h1>
        <p class="text-lg text-[#1860ac]/90 mb-8">
            Step into holographic fashion. Try outfits instantly with
            AI-powered hologram simulation.
        </p>
        <button onclick="goToCapture()" 
                class="bg-[#203d81] text-white font-semibold px-8 py-3 rounded-lg shadow-lg hover:bg-[#1860ac] transition-all mb-6">
            Start Experience
        </button>
        
        <!-- ADDED BACK: Logout button -->
        <div class="mt-4 pt-4 border-t border-gray-200">
            <p class="text-sm text-gray-600 mb-2">Logged in as: <span id="loggedInEmail" class="font-medium"></span></p>
            <button onclick="logout()" 
                    class="text-sm text-red-600 hover:text-red-800 hover:underline">
                Logout
            </button>
        </div>
    </div>

    <script>
        // ========== IMPORTANT CHANGE: REMOVED AUTO-LOGIN ==========
        // NO auto-login - user must enter credentials every time
        // Comment: We're intentionally NOT auto-logging users in
        
        // Optional: Clear any old credentials on page load
        function clearOldCredentials() {
            // You can uncomment these lines if you want to force clear on every page load
            // localStorage.removeItem('holord_token');
            // localStorage.removeItem('holord_user');
            console.log("Page loaded - user must login manually");
        }
        
        // Call on page load
        clearOldCredentials();
        
        function showLoading(show) {
            document.getElementById('loadingSpinner').classList.toggle('hidden', !show);
            document.getElementById('loginForm').classList.toggle('hidden', show);
        }
        
        function showHomepage() {
            // Get user email to display
            const userData = JSON.parse(localStorage.getItem('holord_user') || '{}');
            document.getElementById('loggedInEmail').textContent = userData.email || 'User';
            
            document.getElementById('authCard').classList.add('hidden');
            document.getElementById('homepage').classList.remove('hidden');
            
            // Change background to match homepage style
            document.body.style.background = 'linear-gradient(to bottom, white, #e3f0ff)';
            document.body.className = 'bg-gradient-to-b from-white to-[#e3f0ff] text-[#203d81] min-h-screen flex items-center justify-center';
        }
        
        function showLogin() {
            document.getElementById('authCard').classList.remove('hidden');
            document.getElementById('homepage').classList.add('hidden');
            
            // Change background back to login style
            document.body.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
            document.body.className = 'flex items-center justify-center p-4';
            
            // Clear form fields
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('email').focus();
        }
        
        async function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (!email || !password) {
                alert("Please fill in all fields");
                return;
            }

            try {
                showLoading(true);
                console.log("Attempting login with:", { email });
                
                const res = await fetch("https://holord-backend.onrender.com/api/auth/login", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    showLoading(false);
                    // With new backend, signup is disabled - show appropriate message
                    if (data.message && data.message.includes("Account not found")) {
                        alert("Account not found. Please contact support@holord.com for access.");
                    } else {
                        alert(data.message || "Login failed");
                    }
                    return;
                }

                // Store token and user
                localStorage.setItem("holord_token", data.token);
                localStorage.setItem("holord_user", JSON.stringify(data.user));

                console.log("Login successful!");
                showHomepage();

            } catch (err) {
                showLoading(false);
                console.error("Login error:", err);
                alert("Server error. Try again later.");
            }
        }
        
        // Updated signup function - accounts are now invitation-only
        function showSignupMessage() {
            alert("Account creation is by invitation only.\n\nPlease contact support@holord.com for access.");
            
            // Optional: Clear form
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('email').focus();
        }
        
        function goToCapture() {
            window.location.href = "capture.html";
        }
        
        function logout() {
            // Clear ALL authentication data
            localStorage.removeItem('holord_token');
            localStorage.removeItem('holord_user');
            
            // Optional: Clear session storage too
            sessionStorage.clear();
            
            console.log("User logged out successfully");
            
            // Show login page
            showLogin();
            
            // Optional: Show confirmation message
            // alert("You have been logged out successfully.");
        }
        
        // Enter key to login (only when on login page)
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !document.getElementById('homepage').classList.contains('hidden')) {
                login();
            }
        });
        
        // Auto-focus email field on page load
        document.getElementById('email').focus();
        
        // Optional: Add token expiry check
        function checkTokenExpiry() {
            const token = localStorage.getItem('holord_token');
            if (!token) return true;
            
            try {
                // Simple JWT expiry check (without verification)
                const payload = JSON.parse(atob(token.split('.')[1]));
                const expiryTime = payload.exp * 1000; // Convert to milliseconds
                const currentTime = Date.now();
                
                if (expiryTime < currentTime) {
                    console.log("Token expired, forcing logout");
                    logout();
                    return true;
                }
                return false;
            } catch (error) {
                console.log("Invalid token format");
                return true;
            }
        }
        
        // Check token on page load (optional)
        // checkTokenExpiry();
    </script>
</body>
</html>
